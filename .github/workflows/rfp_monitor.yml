name: CxA RFP Monitor

on:
  schedule:
    - cron: "57 9 * * 1,4"
  workflow_dispatch:
    inputs:
      mode:
        description: "Keyword mode (broad or medium)"
        required: false
        default: "broad"
        type: choice
        options:
          - broad
          - medium
      monitor_type:
        description: "Monitor type (emv, commissioning, or both)"
        required: false
        default: "emv"
        type: choice
        options:
          - emv
          - commissioning
          - both
      dry_run:
        description: "Dry run -- log only, no email, no state update"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      sources:
        description: "Sources to run (sam, utilities, states_direct, google_cse, all)"
        required: false
        default: "all"
      force_all:
        description: "Ignore seen-set and report all passing opportunities"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      send_email:
        description: "Send email digest"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  monitor:
    name: RFP Monitor Run
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RFP Monitor
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SENDGRID_API_KEY: ${{ (github.event_name == 'schedule' || github.event.inputs.send_email == 'true') && secrets.SENDGRID_API_KEY || '' }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MONITOR_TYPE: ${{ github.event.inputs.monitor_type || 'emv' }}
        run: |
          mkdir -p scrapers
          touch scrapers/__init__.py

          if [ "${{ github.event_name }}" = "schedule" ]; then
            for MONITOR in emv commissioning; do
              CMD="python main.py"
              CMD="$CMD --mode broad"
              CMD="$CMD --monitor-type $MONITOR"
              CMD="$CMD --sources all"

              echo "Executing scheduled $MONITOR monitor: $CMD"
              $CMD
            done
          else
            SELECTED_MONITOR="${{ github.event.inputs.monitor_type || 'emv' }}"

            if [ "$SELECTED_MONITOR" = "both" ]; then
              MONITORS="emv commissioning"
            else
              MONITORS="$SELECTED_MONITOR"
            fi

            for MONITOR in $MONITORS; do
              CMD="python main.py"
              CMD="$CMD --mode ${{ github.event.inputs.mode || 'broad' }}"
              CMD="$CMD --monitor-type $MONITOR"
              CMD="$CMD --sources ${{ github.event.inputs.sources || 'all' }}"

              if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
                CMD="$CMD --dry-run"
              fi

              if [ "${{ github.event.inputs.force_all }}" = "true" ]; then
                CMD="$CMD --force-all"
              fi

              echo "Executing manual $MONITOR monitor: $CMD"
              $CMD
            done
          fi

      # Generate the health page only after the monitor loop finishes.
      # Scheduled workflows run EM&V and commissioning in that loop, so
      # both parent/detail sets are persisted before this read begins.
      - name: Generate source-health dashboard
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python generate_source_health_dashboard.py

      - name: Upload dashboard preview artifact
        id: dashboard_preview
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rfp-dashboard-preview
          path: |
            docs/index.html
            docs/emv.html
            docs/commissioning.html
            docs/source-health.html
          if-no-files-found: warn

      # Put the recovery reference on the run's Summary page so a maintainer
      # does not have to infer the source run ID from the browser URL. This is
      # production-only and appears only after the preview artifact exists.
      - name: Add dashboard recovery information to run summary
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && steps.dashboard_preview.outputs.artifact-id != '' }}
        shell: bash
        run: |
          {
            echo "### Dashboard recovery information"
            echo ""
            echo "- **Source workflow run ID:** \`$GITHUB_RUN_ID\`"
            echo "- **Preview artifact:** \`rfp-dashboard-preview\`"
            echo "- **Current run:** [Open workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- **Recovery workflow:** [Redeploy Existing Dashboard]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/redeploy_dashboard.yml)"
            echo ""
            echo "If Pages fails after **RFP Monitor Run** succeeds, open the recovery workflow, select \`main\`, and enter the source workflow run ID shown above."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_pages:
    name: Deploy dashboard to GitHub Pages
    needs: monitor
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download dashboard preview artifact
        uses: actions/download-artifact@v4
        with:
          name: rfp-dashboard-preview
          path: docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Each workflow attempt gets a distinct immutable artifact. This
      # keeps a failed-job rerun from colliding with the first attempt.
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      # The email promises that the dashboard is ready, so this gate
      # and all notification steps intentionally follow deployment.
      - name: Check first-Monday source-health email schedule
        id: monthly_health_email
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          eastern_weekday="$(TZ=America/New_York date +%u)"
          eastern_day="$(TZ=America/New_York date +%-d)"
          if [ "$eastern_weekday" = "1" ] && [ "$eastern_day" -le 7 ] && [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository for monthly health email
        if: ${{ steps.monthly_health_email.outputs.send == 'true' }}
        uses: actions/checkout@v4
        with:
          path: monthly-email-source

      - name: Set up Python for monthly health email
        if: ${{ steps.monthly_health_email.outputs.send == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: monthly-email-source/requirements.txt

      - name: Install monthly health email dependencies
        if: ${{ steps.monthly_health_email.outputs.send == 'true' }}
        working-directory: monthly-email-source
        run: pip install -r requirements.txt

      - name: Send first-Monday source-health email
        if: ${{ steps.monthly_health_email.outputs.send == 'true' }}
        working-directory: monthly-email-source
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python send_monthly_source_health_email.py
