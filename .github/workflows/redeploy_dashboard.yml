name: Redeploy Existing Dashboard

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Workflow run ID containing the rfp-dashboard-preview artifact"
        required: true
        type: string

# The recovery job only reads an existing Actions artifact and publishes it.
# It does not run the monitors or access application credentials.
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Share the same Pages concurrency group as the regular monitor workflow so
# two dashboard deployments cannot run at the same time.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  redeploy_pages:
    name: Redeploy existing dashboard to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 35

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Validate the operator-provided run ID before using it in an artifact
      # request. GitHub workflow run IDs contain digits only.
      - name: Validate source workflow run ID
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "source_run_id must contain digits only."
            exit 1
          fi

      # Download the already-generated dashboards from the selected monitor
      # run. This avoids scraping sources, writing health rows, or sending mail.
      - name: Download existing dashboard preview
        uses: actions/download-artifact@v4
        with:
          name: rfp-dashboard-preview
          path: docs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      # Fail visibly if the source artifact is incomplete rather than
      # publishing a partial dashboard site.
      - name: Validate dashboard files
        shell: bash
        run: |
          set -euo pipefail
          for dashboard_file in index.html emv.html commissioning.html source-health.html massachusetts-contract-schedule.html; do
            if [[ ! -s "docs/$dashboard_file" ]]; then
              echo "Missing or empty dashboard file: docs/$dashboard_file"
              exit 1
            fi
          done
          echo "All five dashboard files are present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # A run-and-attempt-specific name prevents immutable artifact collisions
      # when a maintainer retries this recovery workflow.
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs

      # GitHub can finalize an artifact before it appears in the Actions
      # metadata API used by deploy-pages. Poll for the exact artifact instead
      # of failing the deployment during that short propagation window.
      - name: Wait for Pages artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            artifact_count="$(
              gh api --method GET                 -H "Accept: application/vnd.github+json"                 "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${PAGES_ARTIFACT_NAME}"                 --jq '.total_count'
            )"
            if [ "$artifact_count" -ge 1 ]; then
              echo "Pages artifact metadata is available."
              exit 0
            fi
            echo "Pages artifact metadata is not visible yet (attempt $attempt/18); retrying in 5 seconds."
            sleep 5
          done
          echo "::error::Pages artifact metadata did not become available within 90 seconds."
          exit 1

      # deploy-pages v4 waits for at most ten minutes after the artifact
      # metadata becomes visible. If GitHub reports an Actions or Pages incident,
      # wait for recovery and start a new manual recovery run.
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
